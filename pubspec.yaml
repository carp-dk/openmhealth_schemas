name: openmhealth_schemas
description: A Dart implementation of the IEEE 1752.1 Open mHealth schemas and the Open mHealth (OMH) schemas for mobile health (mHealth) data.
version: 0.3.1
homepage: https://github.com/carp-dk/openmhealth_schemas
repository: https://github.com/carp-dk/openmhealth_schemas
issue_tracker: https://github.com/carp-dk/openmhealth_schemas/issues

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  json_annotation: ^4.8.0
  uuid: '>=3.0.1 <5.0.0'

dev_dependencies:
  flutter_lints: any
  build_runner: any
  json_serializable: any
  test: any
  json_schema: ^5.2.2

